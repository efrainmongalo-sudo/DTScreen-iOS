name: Build DTScreen IPA

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Compilar binario nativo ARM64 con Logo
        run: |
          mkdir -p Payload/DTScreen.app
          SDK_PATH=$(xcrun --sdk iphoneos --show-sdk-path)
          
          # Procesar logo si existe
          for f in AppIcon.png AppIcon.jpg "Logo DT 2026.jpg"; do
            if [ -f "$f" ]; then
              sips -z 120 120 "$f" --out Payload/DTScreen.app/AppIcon60x60@2x.png || true
              sips -z 152 152 "$f" --out Payload/DTScreen.app/AppIcon76x76@2x~ipad.png || true
              break
            fi
          done

          xcrun swiftc -target arm64-apple-ios12.0 -sdk "$SDK_PATH" -parse-as-library ViewController.swift -o Payload/DTScreen.app/DTScreen
          cp Info.plist Payload/DTScreen.app/
          zip -r DTScreen.ipa Payload

      - name: Guardar IPA
        uses: actions/upload-artifact@v4
        with:
          name: DTScreen-App
          path: DTScreen.ipa
