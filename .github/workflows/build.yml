name: Build DTScreen IPA

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Compilar iPad Native App con Logo
        run: |
          mkdir -p Payload/DTScreen.app
          SDK_PATH=$(xcrun --sdk iphoneos --show-sdk-path)

          IMG_FILE=""
          for f in "Logo DT 2026.jpg" "Logo DT 2026.png" AppIcon.png AppIcon.jpg; do
            if [ -f "$f" ]; then IMG_FILE="$f"; break; fi
          done

          if [ -n "$IMG_FILE" ]; then
            sips -z 152 152 "$IMG_FILE" --out Payload/DTScreen.app/AppIcon76x76@2x~ipad.png
            sips -z 76 76 "$IMG_FILE" --out Payload/DTScreen.app/AppIcon76x76~ipad.png
            sips -z 167 167 "$IMG_FILE" --out Payload/DTScreen.app/AppIcon83.5x83.5@2x~ipad.png
            sips -s format png "$IMG_FILE" --out Payload/DTScreen.app/AppIcon.png
          fi

          xcrun swiftc -target arm64-apple-ios12.0 -sdk "$SDK_PATH" -parse-as-library ViewController.swift -o Payload/DTScreen.app/DTScreen
          cp Info.plist Payload/DTScreen.app/
          zip -r DTScreen.ipa Payload

      - name: Guardar IPA
        uses: actions/upload-artifact@v4
        with:
          name: DTScreen-App
          path: DTScreen.ipa
