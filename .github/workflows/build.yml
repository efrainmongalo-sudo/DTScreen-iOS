name: Build DTScreen IPA

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Generar iconos y compilar ARM64
        run: |
          mkdir -p Payload/DTScreen.app
          SDK_PATH=$(xcrun --sdk iphoneos --show-sdk-path)
          
          # Generar iconos si existe imagen
          if [ -f "AppIcon.png" ] || [ -f "AppIcon.jpg" ] || [ -f "Logo DT 2026.jpg" ]; then
            SRC_IMG=$(ls AppIcon.png AppIcon.jpg "Logo DT 2026.jpg" 2>/dev/null | head -n 1)
            sips -z 120 120 "$SRC_IMG" --out Payload/DTScreen.app/AppIcon60x60@2x.png || true
            sips -z 152 152 "$SRC_IMG" --out Payload/DTScreen.app/AppIcon76x76@2x~ipad.png || true
          fi

          xcrun swiftc -target arm64-apple-ios12.0 -sdk "$SDK_PATH" -parse-as-library ViewController.swift -o Payload/DTScreen.app/DTScreen
          cp Info.plist Payload/DTScreen.app/
          zip -r DTScreen.ipa Payload

      - name: Guardar IPA
        uses: actions/upload-artifact@v4
        with:
          name: DTScreen-App
          path: DTScreen.ipa
